<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Esthetic Library | Niandra KZ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --bg-pink: #fff5f8;
            --main-pink: #ff85a2;
            --dark-pink: #ef476f;
            --text-color: #4a4a4a;
            --card-white: #ffffff;
        }

        body {
            background-color: var(--bg-pink);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
        }

        .container { max-width: 1000px; margin: auto; }

        .header-title { 
            text-align: center; 
            color: var(--dark-pink); 
            font-weight: 800; 
            font-size: 30px; 
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .header-sub { text-align: center; color: var(--main-pink); margin-bottom: 40px; font-size: 14px; }

        .search-input {
            width: 100%; padding: 18px 25px; border-radius: 25px;
            border: 2px solid var(--main-pink); background: white;
            outline: none; margin-bottom: 30px; box-sizing: border-box;
            font-size: 15px; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--dark-pink); box-shadow: 0 0 15px rgba(239, 71, 111, 0.1); }

        .card-form {
            background: white; padding: 30px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(239, 71, 111, 0.05);
            margin-bottom: 40px; border: 1px solid #ffeef2;
        }

        .grid-form {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; align-items: end;
        }

        .input-group label {
            display: block; font-size: 11px; font-weight: 800; color: var(--main-pink);
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }

        input, select {
            width: 100%; padding: 14px; border-radius: 15px;
            border: 1px solid #ffe0e9; background: #fffcfd; font-family: inherit;
            font-size: 14px; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--main-pink); outline: none; background: white; }

        .btn-save {
            background: var(--dark-pink); color: white; border: none;
            padding: 16px; border-radius: 15px; font-weight: 700; cursor: pointer;
            transition: 0.3s; font-size: 14px;
        }
        .btn-save:hover { background: #d63359; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(239, 71, 111, 0.3); }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(239, 71, 111, 0.04);
            transition: 0.3s ease;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            transform: translateY(-5px);
            border-color: #ffe0e9;
            box-shadow: 0 10px 30px rgba(239, 71, 111, 0.08);
        }

        .book-card::before {
            content: ''; position: absolute; top: -20px; right: -20px;
            width: 60px; height: 60px; background: var(--bg-pink);
            border-radius: 50%; z-index: 0;
        }

        .card-header { position: relative; z-index: 1; margin-bottom: 15px; }
        .kode-buku { font-size: 12px; font-weight: 700; color: var(--main-pink); margin-bottom: 5px; }
        .judul-buku { font-size: 18px; font-weight: 800; color: var(--text-color); margin: 0; line-height: 1.3; }

        .card-body { position: relative; z-index: 1; flex-grow: 1; margin-bottom: 20px; }
        .penulis-buku { font-size: 14px; color: #7a7a7a; margin-bottom: 15px; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .badge-kategori {
            background: #fff0f3; color: var(--dark-pink);
            padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 700;
        }
        .stok-buku { font-size: 12px; color: #7a7a7a; }
        .stok-buku b { color: var(--text-color); font-size: 16px; }

        .card-footer {
            position: relative; z-index: 1;
            border-top: 1px solid #ffeef2;
            padding-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-link {
            text-decoration: none; font-size: 12px; font-weight: 700;
            padding: 8px 18px; border-radius: 10px; transition: 0.2s; cursor: pointer;
        }
        .edit-link { color: #b99470; background: #fffbef; }
        .del-link { color: var(--dark-pink); background: var(--bg-pink); }

        pre {
            background: #2d2d2d; color: #ffb8c6; padding: 25px; 
            border-radius: 25px; font-size: 12px; margin-top: 60px; 
            overflow-x: auto; line-height: 1.6; border: 2px solid #3d3d3d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">🎀 Pinky Library</h1>
    <p class="header-sub">Koleksi Buku Estetik Niandra KZ (Offline Version)</p>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari judul, penulis, atau kode buku pink..." onkeyup="renderBooks()">

    <div class="card-form">
        <form id="bookForm" class="grid-form">
            <input type="hidden" id="bookId">
            <div class="input-group">
                <label>Kode</label>
                <input type="text" id="kode_buku" placeholder="Contoh: PK01" required>
            </div>
            <div class="input-group">
                <label>Judul Buku</label>
                <input type="text" id="judul" placeholder="Judul yang imut" required>
            </div>
            <div class="input-group">
                <label>Penulis</label>
                <input type="text" id="penulis" placeholder="Nama penulis" required>
            </div>
            <div class="input-group">
                <label>Kategori</label>
                <select id="kategori">
                    <option value="Teknologi">Teknologi</option>
                    <option value="Novel">Novel</option>
                    <option value="Filsafat">Filsafat</option>
                    <option value="Sains">Sains</option>
                    <option value="Ekonomi">Ekonomi</option>
                    <option value="Sejarah">Sejarah</option>
                    <option value="Agama">Agama</option>
                    <option value="Komik">Komik</option>
                </select>
            </div>
            <div class="input-group">
                <label>Stok</label>
                <input type="number" id="stok" value="1">
            </div>
            <button type="submit" id="btnSubmit" class="btn-save">🌸 SIMPAN</button>
        </form>
    </div>

    <div class="book-grid" id="bookGrid">
        </div>

    <h4 style="margin-top:60px; color:var(--dark-pink); font-size: 13px; text-align:center;">📡 Live System Data (JSON Result)</h4>
    <pre id="jsonPreview"></pre>
</div>

<script>
    // Database Simulasi (LocalStorage)
    let books = JSON.parse(localStorage.getItem('niandra_pink_lib')) || [];

    const bookForm = document.getElementById('bookForm');
    const bookGrid = document.getElementById('bookGrid');
    const jsonPreview = document.getElementById('jsonPreview');

    // Fungsi Render Tampilan
    function renderBooks() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = books.filter(b => 
            b.judul.toLowerCase().includes(query) || 
            b.penulis.toLowerCase().includes(query) || 
            b.kode_buku.toLowerCase().includes(query) ||
            b.kategori.toLowerCase().includes(query)
        );

        bookGrid.innerHTML = '';
        filtered.forEach((b) => {
            bookGrid.innerHTML += `
                <div class="book-card">
                    <div class="card-header">
                        <div class="kode-buku">#${b.kode_buku}</div>
                        <h3 class="judul-buku">${b.judul}</h3>
                    </div>
                    <div class="card-body">
                        <div class="penulis-buku">oleh ${b.penulis}</div>
                        <div class="info-row">
                            <span class="badge-kategori">${b.kategori}</span>
                            <div class="stok-buku">Stok: <b>${b.stok}</b></div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="action-link edit-link" onclick="editBook('${b.id}')">Edit</span>
                        <span class="action-link del-link" onclick="deleteBook('${b.id}')">Hapus</span>
                    </div>
                </div>
            `;
        });

        // Update JSON
        jsonPreview.innerText = JSON.stringify({
            status: "success",
            total: filtered.length,
            books: filtered
        }, null, 4);

        // Save ke LocalStorage
        localStorage.setItem('niandra_pink_lib', JSON.stringify(books));
    }

    // Fungsi Simpan / Update
    bookForm.onsubmit = (e) => {
        e.preventDefault();
        const id = document.getElementById('bookId').value;
        const bookData = {
            id: id || Date.now().toString(),
            kode_buku: document.getElementById('kode_buku').value,
            judul: document.getElementById('judul').value,
            penulis: document.getElementById('penulis').value,
            kategori: document.getElementById('kategori').value,
            stok: document.getElementById('stok').value
        };

        if (id) {
            const index = books.findIndex(b => b.id === id);
            books[index] = bookData;
        } else {
            books.push(bookData);
        }

        bookForm.reset();
        document.getElementById('bookId').value = '';
        document.getElementById('kode_buku').disabled = false;
        document.getElementById('btnSubmit').innerText = "🌸 SIMPAN";
        renderBooks();
    };

    // Fungsi Edit
    window.editBook = (id) => {
        const b = books.find(book => book.id === id);
        if (b) {
            document.getElementById('bookId').value = b.id;
            document.getElementById('kode_buku').value = b.kode_buku;
            document.getElementById('kode_buku').disabled = true;
            document.getElementById('judul').value = b.judul;
            document.getElementById('penulis').value = b.penulis;
            document.getElementById('kategori').value = b.kategori;
            document.getElementById('stok').value = b.stok;
            document.getElementById('btnSubmit').innerText = "💖 UPDATE";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    // Fungsi Hapus
    window.deleteBook = (id) => {
        if (confirm('Hapus buku imut ini?')) {
            books = books.filter(b => b.id !== id);
            renderBooks();
        }
    };

    // Inisialisasi awal
    renderBooks();
</script>
</body>
</html>
